<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Might and Magic Style Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #uiOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        #inventory {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        .stat-bar {
            width: 200px;
            height: 20px;
            background-color: #333;
            border: 1px solid #fff;
            margin: 5px 0;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        #healthBar .stat-fill {
            background-color: #f00;
        }

        #expBar .stat-fill {
            background-color: #0f0;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="uiOverlay">
            <div>Level: <span id="level">1</span></div>
            <div>Experience: <span id="experience">0</span>/<span id="expToNextLevel">100</span></div>
            <div class="stat-bar" id="expBar">
                <div class="stat-fill" style="width: 0%"></div>
            </div>
            <div class="stat-bar" id="healthBar">
                <div class="stat-fill" style="width: 100%"></div>
            </div>
        </div>
        <div id="inventory">
            <div>Gold: <span id="gold">0</span></div>
            <div>Items: <span id="items">0</span></div>
        </div>
        <div id="loadingScreen">Loading Game...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
